name: ${name}
version: ${version}
main: ${main}
folia-supported: true
api-version: ${apiVersion}
authors: [ CrazyDev22 ]
website: VolmitSoftware.com

softdepend:
  - PlaceholderAPI
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - CraftEngine
  - ItemsAdder
  - Oraxen
  - Nexo
  - MMOItems
  - ExecutableItems
  - EcoItems
  - Slimefun
  - MythicMobs
  - HeadDatabase

commands:
  holoui:
    aliases: [ holo, hui, holou, hu ]

permissions:
  holoui.preview:
    description: "View contents in holographic container previews"
    default: op
  holoui.open:
    description: "Open a specific menu with holoui.open.<name>"
    default: op
  holoui.command.list:
    description: "List all menus"
    default: op
  holoui.command.open:
    description: "Open a menu"
    default: op
  holoui.command.close:
    description: "Close the current menu"
    default: op
  holoui.command.back:
    description: "Return to the last opened menu"
    default: op
  holoui.command.server:
    description: "Builder server status"
    default: op
  holoui.command.server.start:
    description: "Start the builder server"
    default: op
  holoui.command.server.stop:
    description: "Stops the builder server"
    default: op
  holoui.command.items:
    description: "Custom item provider status"
    default: op
  holoui.command.items.export:
    description: "Export the custom item catalog"
    default: op
  holoui.command.previews:
    description: "List preview documents and their match rules"
    default: op
  holoui.command.previews.reset:
    description: "Restore shipped preview document defaults"
    default: op
  holoui.command.previews.dump:
    description: "Build a preview document once and print its element counts"
    default: op
