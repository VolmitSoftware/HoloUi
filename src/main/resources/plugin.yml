name: ${name}
version: ${version}
main: ${main}
folia-supported: true
api-version: ${apiVersion}
authors: [ CrazyDev22 ]
website: VolmitSoftware.com

softdepend:
  - PlaceholderAPI
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - CraftEngine
  - ItemsAdder
  - Oraxen
  - Nexo
  - MMOItems
  - ExecutableItems
  - EcoItems
  - Slimefun
  - MythicMobs
  - HeadDatabase

commands:
  holoui:
    aliases: [ holo, hui, holou, hu ]

permissions:
  holoui.preview:
    description: "View contents in holographic container previews"
    default: op
  holoui.command:
    description: "Use the /holoui command tree and its tab completion"
    default: op
  holoui.command.list:
    description: "List all menus"
    default: op
  holoui.command.open:
    description: "Open a menu"
    default: op
  holoui.command.close:
    description: "Close the current menu"
    default: op
  holoui.command.move:
    description: "Move the current menu to your position"
    default: op
  holoui.command.back:
    description: "Return to the last opened menu"
    default: op
  holoui.command.builder:
    description: "Get a link to the hosted web editor"
    default: op
  holoui.command.edit:
    description: "Open and synchronize a loaded menu with the web editor"
    default: op
  holoui.command.sync:
    description: "List, poll, inspect, and revoke web editor sync sessions"
    default: op
  holoui.command.items:
    description: "Custom item provider status"
    default: op
  holoui.command.items.export:
    description: "Export the custom item catalog"
    default: op
  holoui.command.previews:
    description: "List preview documents and their match rules"
    default: op
  holoui.command.previews.reset:
    description: "Restore shipped preview document defaults"
    default: op
  holoui.command.previews.dump:
    description: "Build a preview document once and print its element counts"
    default: op
  holoui.command.boards:
    description: "Manage persistent world boards"
    default: op
  holoui.command.boards.editweb:
    description: "Open and synchronize a persistent board project with the web editor"
    default: op
  holoui.command.menus:
    description: "Persistently edit loaded menu content"
    default: op
  holoui.command.import:
    description: "Preview legacy hologram migrations"
    default: op
  holoui.command.import.apply:
    description: "Apply no-overwrite legacy hologram migrations"
    default: op
