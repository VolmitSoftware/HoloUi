[versions]
# plugins
lombokPlugin = "9.2.0"
shadow = "9.0.0-rc3"
slimjar = "2.1.9"
runPaper = "2.3.1"

# libs
lombok = "1.18.44"
paper = "26.2.build.60-beta"
placeholderApi = "2.11.6"
packetevents = "2.13.0"
adventure = "4.26.1"
undertow = "2.2.17.Final"
semVer = "0.7.2"
commons-io = "2.14.0"
commons-imaging = "1.0.0-alpha6"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-nbt = { module = "net.kyori:adventure-nbt", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
undertow = { module = "io.undertow:undertow-core", version.ref = "undertow" }
semver = { module = "com.github.zafarkhaja:java-semver", version.ref = "semVer" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-imaging = { module = "org.apache.commons:commons-imaging", version.ref = "commons-imaging" }

[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombokPlugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
slimjar = { id = "de.crazydev22.slimjar", version.ref = "slimjar" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
